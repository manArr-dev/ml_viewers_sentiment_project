name: Deploy

# Builds both images, pushes them to ECR tagged with the commit SHA, and rolls
# them out to EKS. Requires these repository variables (Settings > Secrets and
# variables > Actions > Variables), all of which are Terraform outputs:
#   AWS_REGION, AWS_ROLE_ARN, EKS_CLUSTER_NAME

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two rollouts at once, and never cancel one halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # Skips cleanly (instead of failing) until the AWS side has been set up.
    if: vars.AWS_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # exchange the GitHub OIDC token for AWS credentials
    env:
      NAMESPACE: rag
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/rag-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          provenance: false

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/rag-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
          provenance: false

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION }}" --name "${{ vars.EKS_CLUSTER_NAME }}"

      - name: Deploy
        working-directory: k8s/overlays/prod
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          kustomize edit set image \
            "rag-backend=${REGISTRY}/rag-backend:${GITHUB_SHA}" \
            "rag-frontend=${REGISTRY}/rag-frontend:${GITHUB_SHA}"
          kubectl apply -k .

      - name: Wait for rollout
        run: |
          kubectl -n "$NAMESPACE" rollout status deployment/backend --timeout=10m
          kubectl -n "$NAMESPACE" rollout status deployment/frontend --timeout=5m

      - name: Show state on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" get pods -o wide
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -n 30
